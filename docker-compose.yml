services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: school_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d school_db"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  ocr:
    build:
      context: ./ocr
      dockerfile: Dockerfile
    environment:
      OCR_DEVICE: cpu
      PIX2TEXT_HOME: /models/pix2text
      CNOCR_HOME: /models/cnocr
      CNSTD_HOME: /models/cnstd
      HF_HOME: /models/huggingface
      HF_HUB_CACHE: /models/huggingface/hub
      TORCH_HOME: /models/torch
      XDG_CACHE_HOME: /models/cache
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ocr_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  postgres_data:
  ocr_models:
